name: Build iOS IPA (with WidgetKit)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式：unsigned（免证书未签名真机 .ipa，供全能签/轻松签自签）、signed（云端直接签名 .ipa）、simulator（模拟器包）"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - signed
          - simulator
      include_widget:
        description: "是否打包并嵌入 iOS 桌面小组件（StillPoetsWidget.appex）"
        required: true
        default: true
        type: boolean
      bundle_id_override:
        description: "可选：自定义主 App Bundle ID（默认 app.stillpoets.client）"
        required: false
        default: ""
        type: string

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build StillPoets iOS (${{ inputs.build_mode || 'unsigned' }})
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules & install matching MyGo CLI
        run: |
          set -euo pipefail
          go mod download
          MODE="${{ inputs.build_mode || 'unsigned' }}"
          if [ "${MODE}" = "unsigned" ]; then
            CI_BIN_DIR="${RUNNER_TEMP}/mygo-ci-bin"
            python3 scripts/build_mygo_ci_cli.py \
              --work-dir "${RUNNER_TEMP}/mygo-ci-work" \
              --out-bin "${CI_BIN_DIR}/mygo"
            echo "${CI_BIN_DIR}" >> "$GITHUB_PATH"
          else
            MYGO_VER=$(go list -m -f '{{.Version}}' github.com/egoist/mygo)
            echo "Installing mygo CLI @ ${MYGO_VER}"
            go install "github.com/egoist/mygo/cmd/mygo@${MYGO_VER}"
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Apple signing certificate & provisioning profile
        if: ${{ (inputs.build_mode || 'unsigned') == 'signed' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_P12_BASE64}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "::error::缺少签名 Secrets：请在仓库 Settings -> Secrets and variables -> Actions 中配置 IOS_P12_BASE64、IOS_P12_PASSWORD 和 IOS_PROVISIONING_PROFILE_BASE64。"
            exit 1
          fi

          CERT_DIR="${RUNNER_TEMP}/ios-signing"
          mkdir -p "${CERT_DIR}"
          KEYCHAIN_PATH="${CERT_DIR}/build.keychain-db"
          KEYCHAIN_PASS="stillpoets-ci-$(date +%s)"
          P12_PATH="${CERT_DIR}/cert.p12"
          MAIN_PROFILE_PATH="${CERT_DIR}/main.mobileprovision"
          WIDGET_PROFILE_PATH=""

          printf '%s' "${IOS_P12_BASE64}" | tr -d '[:space:]' | base64 --decode > "${P12_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${MAIN_PROFILE_PATH}"

          if [ -n "${IOS_WIDGET_PROVISIONING_PROFILE_BASE64}" ]; then
            WIDGET_PROFILE_PATH="${CERT_DIR}/widget.mobileprovision"
            printf '%s' "${IOS_WIDGET_PROVISIONING_PROFILE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${WIDGET_PROFILE_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

          security import "${P12_PATH}" \
            -P "${IOS_P12_PASSWORD}" \
            -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_PATH}"

          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q '1) '; then
            echo "No valid codesigning identity yet; installing Apple WWDR intermediate certificates..."
            for cert_url in \
              "https://developer.apple.com/certificationauthority/AppleWWDRCA.cer" \
              "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" \
              "https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer" \
              "https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer"; do
              cer_file="${CERT_DIR}/$(basename "${cert_url}")"
              curl -fsSL "${cert_url}" -o "${cer_file}" && security import "${cer_file}" -k "${KEYCHAIN_PATH}" -A || true
            done
          fi

          echo "Available code signing identities:"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q '1) '; then
            echo "::error::导入 .p12 后未检测到有效的签名身份，请检查 IOS_P12_BASE64 / IOS_P12_PASSWORD 是否正确或证书是否已过期。"
            exit 1
          fi

          echo "CI_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "CI_CERT_DIR=${CERT_DIR}" >> "$GITHUB_ENV"
          echo "CI_MAIN_PROFILE_PATH=${MAIN_PROFILE_PATH}" >> "$GITHUB_ENV"
          echo "CI_WIDGET_PROFILE_PATH=${WIDGET_PROFILE_PATH}" >> "$GITHUB_ENV"

      - name: Configure mygo.json for iOS target
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode || 'unsigned' }}"
          INCLUDE_WIDGET="${{ inputs.include_widget }}"
          if [ -z "${INCLUDE_WIDGET}" ]; then
            INCLUDE_WIDGET="true"
          fi
          python3 scripts/prepare_ios_ci.py \
            --config mygo.json \
            --mode "${MODE}" \
            --include-widget "${INCLUDE_WIDGET}" \
            --profile "${CI_MAIN_PROFILE_PATH:-}" \
            --widget-profile "${CI_WIDGET_PROFILE_PATH:-}" \
            --bundle-id-override "${{ inputs.bundle_id_override || '' }}" \
            --appex-path "native/ios/build/StillPoetsWidget.appex" \
            --github-env "$GITHUB_ENV"

      - name: Build StillPoetsWidget.appex with XcodeGen & xcodebuild
        if: ${{ env.BUILD_WIDGET == 'true' }}
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen generate --spec native/ios/project.yml --project native/ios

          MODE="${{ inputs.build_mode || 'unsigned' }}"
          SDK="iphoneos"
          if [ "${MODE}" = "simulator" ]; then
            SDK="iphonesimulator"
          fi

          xcodebuild \
            -project native/ios/StillPoetsWidget.xcodeproj \
            -scheme StillPoetsWidget \
            -configuration Release \
            -sdk "${SDK}" \
            -arch arm64 \
            -derivedDataPath native/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="${WIDGET_BUNDLE_ID}" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${APP_BUILD_NUMBER}" \
            STILLPOETS_KEYCHAIN_GROUP="${STILLPOETS_KEYCHAIN_GROUP}" \
            STILLPOETS_APP_GROUP="${STILLPOETS_APP_GROUP}" \
            build

          APPEX_SRC="native/ios/DerivedData/Build/Products/Release-${SDK}/StillPoetsWidget.appex"
          if [ ! -d "${APPEX_SRC}" ]; then
            echo "::error::未找到编译生成的 ${APPEX_SRC}"
            exit 1
          fi
          rm -rf native/ios/build
          mkdir -p native/ios/build
          cp -R "${APPEX_SRC}" native/ios/build/StillPoetsWidget.appex
          echo "Built widget extension:"
          plutil -p native/ios/build/StillPoetsWidget.appex/Info.plist

      - name: Build iOS package with MyGo
        run: |
          set -euo pipefail
          mygo native check modules/widgetbridge
          mygo native check modules/photosaver
          MODE="${{ inputs.build_mode || 'unsigned' }}"
          if [ "${MODE}" = "simulator" ]; then
            mygo build -platform ios/simulator -o build
            echo "Built simulator bundle:"
            ls -la build/ios-simulator
          elif [ "${MODE}" = "unsigned" ]; then
            MYGO_IOS_UNSIGNED=1 mygo build -platform ios -o build
            echo "Built unsigned device IPA:"
            ls -lh build/ios-arm64
          else
            mygo build -platform ios -o build
            echo "Built signed device IPA:"
            ls -lh build/ios-arm64
          fi

      - name: Upload IPA artifact
        if: ${{ (inputs.build_mode || 'unsigned') != 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: StillPoets-iOS-${{ env.APP_VERSION }}-${{ env.IOS_DISTRIBUTION }}
          path: build/ios-arm64/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator bundle artifact
        if: ${{ (inputs.build_mode || 'unsigned') == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: StillPoets-iOS-Simulator-${{ env.APP_VERSION }}
          path: build/ios-simulator/*.app
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup temporary keychain and certificates
        if: always()
        run: |
          if [ -n "${CI_KEYCHAIN_PATH:-}" ] && [ -f "${CI_KEYCHAIN_PATH}" ]; then
            security delete-keychain "${CI_KEYCHAIN_PATH}" || true
          fi
          if [ -n "${CI_CERT_DIR:-}" ] && [ -d "${CI_CERT_DIR}" ]; then
            rm -rf "${CI_CERT_DIR}" || true
          fi
