# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# GitHub 独立检查：参数个数
# 手动跳过：SKIP_PARAMS=true
# 失败不阻断：PARAMS_NONBLOCK=true
# 密钥扫描不受这两个变量控制。

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - "main.go"
        - "internal/**/*.go"
        - "modules/**/*.go"
        - "quality/**"
        - ".woodpecker/参数个数.yaml"
      on_empty: false

steps:
  - name: 参数个数
    image: golang:1.27-bookworm
    when:
      - evaluate: 'SKIP_PARAMS != "true" && PARAMS_NONBLOCK != "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json params
  - name: 参数个数（不阻断）
    image: golang:1.27-bookworm
    failure: ignore
    when:
      - evaluate: 'SKIP_PARAMS != "true" && PARAMS_NONBLOCK == "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json params
