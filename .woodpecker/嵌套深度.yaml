# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# GitHub 独立检查：嵌套深度
# 手动跳过：SKIP_NESTING=true
# 失败不阻断：NESTING_NONBLOCK=true
# 密钥扫描不受这两个变量控制。

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - "main.go"
        - "internal/**/*.go"
        - "modules/**/*.go"
        - "quality/**"
        - ".woodpecker/嵌套深度.yaml"
      on_empty: false

steps:
  - name: 嵌套深度
    image: golang:1.27-bookworm
    when:
      - evaluate: 'SKIP_NESTING != "true" && NESTING_NONBLOCK != "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json nesting
  - name: 嵌套深度（不阻断）
    image: golang:1.27-bookworm
    failure: ignore
    when:
      - evaluate: 'SKIP_NESTING != "true" && NESTING_NONBLOCK == "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json nesting
