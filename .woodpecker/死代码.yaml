# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodpecker-ci/woodpecker/v3.19.0/pipeline/frontend/yaml/linter/schema/schema.json
# GitHub 独立检查：死代码与残留
# 手动跳过：SKIP_DEAD_CODE=true
# 失败不阻断：DEAD_CODE_NONBLOCK=true
# 密钥扫描不受这两个变量控制。

when:
  - event: [push, pull_request, manual]
    path:
      include:
        - "main.go"
        - "internal/**/*.go"
        - "modules/**/*.go"
        - "quality/**"
        - ".woodpecker/死代码.yaml"
      on_empty: false

steps:
  - name: 死代码
    image: golang:1.27-bookworm
    when:
      - evaluate: 'SKIP_DEAD_CODE != "true" && DEAD_CODE_NONBLOCK != "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json dead-code
  - name: 死代码（不阻断）
    image: golang:1.27-bookworm
    failure: ignore
    when:
      - evaluate: 'SKIP_DEAD_CODE != "true" && DEAD_CODE_NONBLOCK == "true"'
    commands:
      - go run ./quality/gocheck --config quality/go-quality.json dead-code
