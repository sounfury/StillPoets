<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets Icon 2A - 抽象书脊双弧（暖纸画册版）</title>
  <!-- 暖纸白底 -->
  <rect width="1024" height="1024" fill="#F4F4EF"/>

  <!-- 底层衬页：鼠尾草绿柔和几何圆弧（营造翻页纸叠层次） -->
  <path
    d="M 336 270
       C 430 198, 560 184, 670 218
       C 636 392, 514 574, 344 716
       L 284 716
       L 284 446
       C 284 360, 304 298, 336 270 Z"
    fill="#CFD8C6"
  />

  <!-- 左上主书页：赤陶几何大弧面（直脊 + 舒展拱弧） -->
  <path
    d="M 224 724
       L 224 440
       C 224 274, 352 184, 560 184
       C 554 410, 424 606, 224 724 Z"
    fill="#BC5B46"
  />

  <!-- 右下对称书页：墨蓝几何大弧面（与赤陶夹出柔润负空间 S 折缝） -->
  <path
    d="M 800 300
       L 800 584
       C 800 750, 672 840, 464 840
       C 470 614, 600 418, 800 300 Z"
    fill="#334C68"
  />

  <!-- 右上停顿圆点（平衡对角重量，呼应 Still） -->
  <circle cx="744" cy="224" r="40" fill="#CFD8C6"/>
</svg>
