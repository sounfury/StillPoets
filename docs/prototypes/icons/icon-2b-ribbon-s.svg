<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets Icon 2B - 几何折页 S（深墨蓝出版徽标）</title>
  <!-- 深墨蓝实色底 -->
  <rect width="1024" height="1024" fill="#334C68"/>

  <!-- 上半折页弧（赤陶）：圆心 (458, 379)，外半径 196，内半径 70，中腰精确落在 y=449..575 -->
  <path
    d="M 730 183
       L 458 183
       A 196 196 0 0 0 458 575
       L 474 575
       L 550 449
       L 458 449
       A 70 70 0 0 1 458 309
       L 730 309
       A 24 24 0 0 0 754 285
       L 754 207
       A 24 24 0 0 0 730 183 Z"
    fill="#BC5B46"
  />

  <!-- 下半折页弧（暖纸白）：圆心 (566, 645)，180° 严格中心对称，中腰共享 y=449..575 -->
  <path
    d="M 294 841
       L 566 841
       A 196 196 0 0 0 566 449
       L 550 449
       L 474 575
       L 566 575
       A 70 70 0 0 1 566 715
       L 294 715
       A 24 24 0 0 0 270 739
       L 270 817
       A 24 24 0 0 0 294 841 Z"
    fill="#F4F4EF"
  />

  <!-- 中腰斜切微缝（精确过中心 (512, 512)，让两页纸保持轻盈呼吸感） -->
  <line x1="560" y1="433" x2="464" y2="591" stroke="#334C68" stroke-width="26" stroke-linecap="butt"/>

  <!-- 右侧节奏圆点：鼠尾草绿单点作为停顿（Still）视觉锚，与上弧水平中线对齐 -->
  <circle cx="714" cy="379" r="36" fill="#CFD8C6"/>
</svg>
