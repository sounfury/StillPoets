<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets V2-2 - 孔版画册：巨型雕塑引号与叠印日轮</title>
  <defs>
    <clipPath id="quote-clip">
      <path d="M 624 410 C 624 612, 510 758, 314 824 C 294 830, 280 812, 294 794 C 388 716, 442 652, 456 604 A 196 196 0 1 1 624 410 Z"/>
    </clipPath>
  </defs>

  <!-- 明快暖柠檬奶黄画册底 -->
  <rect width="1024" height="1024" fill="#FDE97E"/>

  <!-- 背景极淡暖白纸面弧光（增添画册纸叠层次） -->
  <circle cx="512" cy="512" r="416" fill="#FFF7CC" opacity="0.55"/>

  <!-- 雕塑感巨型克莱因蓝弯引号（精确切线连续） -->
  <path
    d="M 624 410
       C 624 612, 510 758, 314 824
       C 294 830, 280 812, 294 794
       C 388 716, 442 652, 456 604
       A 196 196 0 1 1 624 410 Z"
    fill="#1E4AE6"
  />

  <!-- 右上热烈珊瑚朱红圆日 -->
  <circle cx="680" cy="340" r="162" fill="#F25236"/>

  <!-- 孔版印刷（Risograph）正片叠印交叠色：浓郁深梅紫 -->
  <circle cx="680" cy="340" r="162" fill="#5A1E66" clip-path="url(#quote-clip)"/>

  <!-- 诗意星芒点缀（四芒微光，平衡右下留白，呼应灵感诗眼） -->
  <path
    d="M 702 624
       Q 702 706, 784 706
       Q 702 706, 702 788
       Q 702 706, 620 706
       Q 702 706, 702 624 Z"
    fill="#FFFDF5"
  />
  <!-- 星芒旁小巧珊瑚句点 -->
  <circle cx="776" cy="774" r="24" fill="#F25236"/>
</svg>
