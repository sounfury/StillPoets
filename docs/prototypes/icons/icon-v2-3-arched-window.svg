<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets V2-3 - 晴空拱窗：展翅诗页与暖阳</title>
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD4FF"/>
      <stop offset="56%" stop-color="#DCF3FF"/>
      <stop offset="100%" stop-color="#FFF0B2"/>
    </linearGradient>
    <clipPath id="inner-arch">
      <path d="M 272 446 A 240 240 0 0 1 752 446 L 752 798 A 18 18 0 0 1 734 816 L 290 816 A 18 18 0 0 1 272 798 Z"/>
    </clipPath>
  </defs>

  <!-- 高明度克莱因晴空蓝实底 -->
  <rect width="1024" height="1024" fill="#2354E8"/>

  <!-- 暖奶油白建筑感诗意拱窗外框 -->
  <path
    d="M 224 446
       A 288 288 0 0 1 800 446
       L 800 818
       A 42 42 0 0 1 758 860
       L 266 860
       A 42 42 0 0 1 224 818 Z"
    fill="#FFFBF2"
  />

  <!-- 拱窗内部风景（地中海诗集画册风） -->
  <g clip-path="url(#inner-arch)">
    <!-- 澄澈晨光渐变天空 -->
    <rect x="272" y="206" width="480" height="610" fill="url(#sky-grad)"/>

    <!-- 热烈饱满的珊瑚橘红太阳 -->
    <circle cx="512" cy="400" r="108" fill="#F55B3B"/>

    <!-- 远景明媚薄荷绿柔和山丘 -->
    <path
      d="M 250 676
         Q 390 580, 560 656
         Q 670 704, 774 636
         L 774 830
         L 250 830 Z"
      fill="#52CC98"
    />

    <!-- 近景清新翠青起伏坡线 -->
    <path
      d="M 250 724
         Q 432 664, 594 736
         Q 694 778, 774 714
         L 774 830
         L 250 830 Z"
      fill="#1B9A82"
    />

    <!-- 底层微露的暖金内页（表现诗集多层翻开） -->
    <path
      d="M 512 596
         C 456 546, 386 534, 318 552
         C 368 518, 444 516, 512 560
         C 580 516, 656 518, 706 552
         C 638 534, 568 546, 512 596 Z"
      fill="#FFE184"
    />

    <!-- 悬停在太阳与绿丘之间的「展翅白书页 / 飞鸟」双关主角 -->
    <path
      d="M 512 582
         C 462 528, 392 512, 318 528
         C 358 468, 442 460, 512 522
         C 582 460, 666 468, 706 528
         C 632 512, 562 528, 512 582 Z"
      fill="#FFFDF8"
    />
  </g>
</svg>
