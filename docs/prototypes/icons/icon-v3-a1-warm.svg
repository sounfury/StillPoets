<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets V3-A1 - 掌心诗集 · 暖色版（赤陶布面 × 棉纸诗笺 × 鼠尾草书签）</title>
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>

    <!-- 阳光暖陶精装布面渐变（承接 Artbook 赤陶 #BC5B46，微提通透暖度） -->
    <linearGradient id="cover-grad" x1="0.16" y1="0" x2="0.92" y2="1">
      <stop offset="0%" stop-color="#D26E55"/>
      <stop offset="52%" stop-color="#C15D47"/>
      <stop offset="100%" stop-color="#AD4C37"/>
    </linearGradient>

    <!-- 左侧布面书脊微暗渐层 -->
    <linearGradient id="spine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A14532"/>
      <stop offset="76%" stop-color="#B1513C"/>
      <stop offset="100%" stop-color="#98402E"/>
    </linearGradient>

    <!-- 书脊压痕折槽（精装书脊立体凹槽） -->
    <linearGradient id="hinge-groove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#702B1D" stop-opacity="0"/>
      <stop offset="32%" stop-color="#702B1D" stop-opacity="0.44"/>
      <stop offset="48%" stop-color="#5D2216" stop-opacity="0.60"/>
      <stop offset="66%" stop-color="#F0A28D" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F0A28D" stop-opacity="0"/>
    </linearGradient>

    <!-- 柔和斜向自然漫反射 -->
    <radialGradient id="book-sheen" cx="0.28" cy="0.12" r="0.88">
      <stop offset="0%" stop-color="#FFF6EC" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFF6EC" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#3E160E" stop-opacity="0.09"/>
    </radialGradient>

    <!-- 棉纸诗笺渐变（源自 Artbook Surface #FAF9F5 / #F4F4EF） -->
    <linearGradient id="paper-grad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FDFCF8"/>
      <stop offset="65%" stop-color="#F8F6EF"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>

    <!-- 雅致鼠尾草绿丝带书签渐变 -->
    <linearGradient id="ribbon-grad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#77906A"/>
      <stop offset="55%" stop-color="#89A27B"/>
      <stop offset="100%" stop-color="#738C66"/>
    </linearGradient>

    <!-- 纸笺接触投影与漫投影 -->
    <filter id="plate-shadow" x="-16%" y="-12%" width="136%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#561E13" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4A1A10" flood-opacity="0.18"/>
    </filter>

    <!-- 丝带书签轻柔落影 -->
    <filter id="ribbon-shadow" x="-25%" y="-10%" width="155%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#3E2A1E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- 1. 精装赤陶布面封面底 -->
    <rect width="1024" height="1024" fill="url(#cover-grad)"/>

    <!-- 2. 左侧书脊与压痕折槽（呼应 V3 实体书封折痕） -->
    <rect x="0" y="0" width="182" height="1024" fill="url(#spine-grad)"/>
    <rect x="148" y="0" width="2" height="1024" fill="#F7C2B2" fill-opacity="0.12"/>
    <rect x="170" y="0" width="38" height="1024" fill="url(#hinge-groove)"/>

    <!-- 整体布面自然光线漫反射 -->
    <rect width="1024" height="1024" fill="url(#book-sheen)"/>

    <!-- 3. 嵌入式暖棉纸诗笺（Tip-in Plate，严格位于 Android 圆形安全区内） -->
    <g filter="url(#plate-shadow)">
      <rect x="312" y="204" width="564" height="616" rx="30" fill="url(#paper-grad)"/>
    </g>
    <!-- 诗笺极细压凹内框（出版物盲压装帧细节） -->
    <rect x="334" y="226" width="520" height="572" rx="18" fill="none" stroke="#E0DCD0" stroke-width="2.5"/>

    <!-- 4. 诗笺内：现代诗三行错落诗节 + 被点亮的金句（视觉重心居中舒展） -->
    <!-- 第一行：短引句 -->
    <rect x="392" y="392" width="212" height="44" rx="22" fill="#2A2825"/>

    <!-- 第二行：被划出点亮的金句（鼠尾草绿高亮底带 + 赤陶红诗行，56px 依旧清晰可辨） -->
    <rect x="370" y="472" width="436" height="90" rx="22" fill="#DAE5D1"/>
    <rect x="392" y="495" width="388" height="44" rx="22" fill="#BF5B45"/>

    <!-- 第三行：收束短句 + Still 停顿圆点 -->
    <rect x="392" y="598" width="188" height="44" rx="22" fill="#2A2825"/>
    <circle cx="628" cy="620" r="22" fill="#BF5B45"/>

    <!-- 5. 从书口顶边垂落的鼠尾草绿丝带书签（燕尾切口，内收留出右上呼吸空间） -->
    <g filter="url(#ribbon-shadow)">
      <path d="M 674 0 L 758 0 L 758 326 L 716 286 L 674 326 Z" fill="url(#ribbon-grad)"/>
      <rect x="687" y="0" width="6" height="308" fill="#EBF3E5" fill-opacity="0.24"/>
    </g>
  </g>
</svg>
