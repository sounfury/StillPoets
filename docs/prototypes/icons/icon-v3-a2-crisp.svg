<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets V3-A2 - 掌心诗集 · 清亮色版（克莱因刊物蓝 × 纯纸白诗笺 × 暖朱红书签）</title>
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>

    <!-- 清亮克莱因刊物蓝精装封面渐变（源自 Editorial Accent #2345B5） -->
    <linearGradient id="cover-grad" x1="0.16" y1="0" x2="0.92" y2="1">
      <stop offset="0%" stop-color="#315BE0"/>
      <stop offset="52%" stop-color="#2447BC"/>
      <stop offset="100%" stop-color="#1B3799"/>
    </linearGradient>

    <!-- 左侧书脊深半阶刊物蓝 -->
    <linearGradient id="spine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18328C"/>
      <stop offset="76%" stop-color="#1E3DA6"/>
      <stop offset="100%" stop-color="#152C7D"/>
    </linearGradient>

    <!-- 书脊压痕折槽 -->
    <linearGradient id="hinge-groove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B194D" stop-opacity="0"/>
      <stop offset="32%" stop-color="#0B194D" stop-opacity="0.46"/>
      <stop offset="48%" stop-color="#08133D" stop-opacity="0.62"/>
      <stop offset="66%" stop-color="#84A3FF" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#84A3FF" stop-opacity="0"/>
    </linearGradient>

    <!-- 清透纸书漫反射微光 -->
    <radialGradient id="book-sheen" cx="0.28" cy="0.12" r="0.88">
      <stop offset="0%" stop-color="#EEF4FF" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#EEF4FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0B1745" stop-opacity="0.10"/>
    </radialGradient>

    <!-- 纯清亮纸白诗笺（源自 Editorial Paper #FFFFFF） -->
    <linearGradient id="paper-grad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#FCFDFF"/>
      <stop offset="100%" stop-color="#F2F6FC"/>
    </linearGradient>

    <!-- 暖朱红丝带书签（欧洲独立诗刊经典蓝白红撞色点睛） -->
    <linearGradient id="ribbon-grad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#E85745"/>
      <stop offset="55%" stop-color="#DB4837"/>
      <stop offset="100%" stop-color="#C63B2C"/>
    </linearGradient>

    <!-- 纸笺清透接触投影 -->
    <filter id="plate-shadow" x="-16%" y="-12%" width="136%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B194E" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A1645" flood-opacity="0.20"/>
    </filter>

    <!-- 丝带书签轻柔落影 -->
    <filter id="ribbon-shadow" x="-25%" y="-10%" width="155%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0F1F5C" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- 1. 清亮克莱因蓝精装封面底 -->
    <rect width="1024" height="1024" fill="url(#cover-grad)"/>

    <!-- 2. 左侧书脊与压痕折槽 -->
    <rect x="0" y="0" width="182" height="1024" fill="url(#spine-grad)"/>
    <rect x="148" y="0" width="2" height="1024" fill="#A6BEFF" fill-opacity="0.15"/>
    <rect x="170" y="0" width="38" height="1024" fill="url(#hinge-groove)"/>

    <!-- 整体布面自然漫反射 -->
    <rect width="1024" height="1024" fill="url(#book-sheen)"/>

    <!-- 3. 嵌入式清亮纯白诗笺（Tip-in Plate） -->
    <g filter="url(#plate-shadow)">
      <rect x="312" y="204" width="564" height="616" rx="30" fill="url(#paper-grad)"/>
    </g>
    <!-- 诗笺极细压凹内框 -->
    <rect x="334" y="226" width="520" height="572" rx="18" fill="none" stroke="#E3E8F2" stroke-width="2.5"/>

    <!-- 4. 诗笺内：现代诗三行错落诗节 + 被点亮的金句（视觉重心居中舒展） -->
    <!-- 第一行：短引句 -->
    <rect x="392" y="392" width="212" height="44" rx="22" fill="#181A20"/>

    <!-- 第二行：被划出点亮的金句（清透浅蓝高亮底带 + 克莱因刊物蓝诗行） -->
    <rect x="370" y="472" width="436" height="90" rx="22" fill="#DCE7FF"/>
    <rect x="392" y="495" width="388" height="44" rx="22" fill="#2345B5"/>

    <!-- 第三行：收束短句 + 暖朱红停顿圆点（与上方丝带遥相呼应） -->
    <rect x="392" y="598" width="188" height="44" rx="22" fill="#181A20"/>
    <circle cx="628" cy="620" r="22" fill="#DF4B3A"/>

    <!-- 5. 从书口顶边垂落的暖朱红丝带书签（燕尾切口） -->
    <g filter="url(#ribbon-shadow)">
      <path d="M 674 0 L 758 0 L 758 326 L 716 286 L 674 326 Z" fill="url(#ribbon-grad)"/>
      <rect x="687" y="0" width="6" height="308" fill="#FFD9D4" fill-opacity="0.28"/>
    </g>
  </g>
</svg>
