<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets V4-2 - 展开的诗集与银杏 · 清亮晴空版（克莱因蓝 × 纯白书页 × 广角银杏金叶）</title>
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>

    <!-- 清亮澄澈的刊物蓝背景（源自 Editorial Accent #2345B5） -->
    <linearGradient id="bg-grad" x1="0.16" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#3662EB"/>
      <stop offset="52%" stop-color="#254BC6"/>
      <stop offset="100%" stop-color="#1B389C"/>
    </linearGradient>

    <radialGradient id="bg-glow" cx="0.28" cy="0.18" r="0.82">
      <stop offset="0%" stop-color="#B3CCFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#091542" stop-opacity="0.12"/>
    </radialGradient>

    <!-- 精装深靛蓝硬壳底托 -->
    <linearGradient id="board-grad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#152B7A"/>
      <stop offset="50%" stop-color="#0F2161"/>
      <stop offset="100%" stop-color="#19328C"/>
    </linearGradient>

    <!-- 纸页侧面叠层 -->
    <linearGradient id="stack-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDE5F4"/>
      <stop offset="100%" stop-color="#C8D4EA"/>
    </linearGradient>

    <!-- 左书页（清亮纯纸白） -->
    <linearGradient id="left-page" x1="0" y1="0.2" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#FAFCFF"/>
      <stop offset="72%" stop-color="#FFFFFF"/>
      <stop offset="92%" stop-color="#EAF0FA"/>
      <stop offset="100%" stop-color="#D6E0F2"/>
    </linearGradient>

    <!-- 右书页（近中缝微蓝柔影，向外纯白透亮） -->
    <linearGradient id="right-page" x1="0" y1="0.3" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#CCD8EE"/>
      <stop offset="11%" stop-color="#E5ECF8"/>
      <stop offset="36%" stop-color="#F9FBFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- 银杏左扇（晴阳明金） -->
    <linearGradient id="ginkgo-light" x1="0.2" y1="0.9" x2="0.7" y2="0.05">
      <stop offset="0%" stop-color="#E99F2A"/>
      <stop offset="48%" stop-color="#F6C144"/>
      <stop offset="100%" stop-color="#FCD96C"/>
    </linearGradient>

    <!-- 银杏右扇（温润琥珀金） -->
    <linearGradient id="ginkgo-dark" x1="0.1" y1="0.85" x2="0.9" y2="0.15">
      <stop offset="0%" stop-color="#D37C1D"/>
      <stop offset="54%" stop-color="#E89D2D"/>
      <stop offset="100%" stop-color="#F4BC42"/>
    </linearGradient>

    <!-- 书本柔和投影 -->
    <filter id="book-shadow" x="-14%" y="-14%" width="128%" height="136%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#0A1747" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0A1747" flood-opacity="0.22"/>
    </filter>

    <!-- 银杏落叶轻栖于书页的微距悬浮影 -->
    <filter id="leaf-shadow" x="-20%" y="-20%" width="145%" height="150%">
      <feDropShadow dx="6" dy="16" stdDeviation="13" flood-color="#19336E" flood-opacity="0.22"/>
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#19336E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- 1. 清亮克莱因蓝底 -->
    <rect width="1024" height="1024" fill="url(#bg-grad)"/>
    <rect width="1024" height="1024" fill="url(#bg-glow)"/>

    <!-- 2. 展开的精装诗集 -->
    <g filter="url(#book-shadow)">
      <!-- 精装深靛蓝硬壳底托 -->
      <path d="M 150 374
               C 148 362, 158 354, 170 356
               C 296 340, 424 356, 512 396
               C 600 356, 728 340, 854 356
               C 866 354, 876 362, 874 374
               L 886 728
               C 888 746, 875 758, 858 756
               C 728 734, 608 742, 534 774
               C 520 780, 504 780, 490 774
               C 416 742, 296 734, 166 756
               C 149 758, 136 746, 138 728 Z"
            fill="url(#board-grad)"/>

      <!-- 纸页叠层厚度 -->
      <path d="M 168 358
               C 294 326, 424 340, 512 380
               C 600 340, 730 326, 856 358
               L 864 714
               C 732 690, 606 706, 512 748
               C 418 706, 292 690, 160 714 Z"
            fill="url(#stack-grad)"/>
      <path d="M 164 700 C 292 676, 418 692, 512 734 C 606 692, 732 676, 860 700"
            fill="none" stroke="#B6C5E2" stroke-width="2.5" stroke-opacity="0.75"/>

      <!-- 左页：清亮纯纸白 -->
      <path d="M 512 368
               C 430 320, 298 308, 178 340
               L 164 684
               C 290 656, 422 670, 512 718 Z"
            fill="url(#left-page)"/>

      <!-- 右页：清亮纯纸白 -->
      <path d="M 512 368
               C 594 320, 726 308, 846 340
               L 860 684
               C 734 656, 602 670, 512 718 Z"
            fill="url(#right-page)"/>

      <!-- 书脊中缝折影线 -->
      <path d="M 512 368 L 512 718" stroke="#B4C3DF" stroke-width="2.5" stroke-opacity="0.7"/>

      <!-- 左页极淡的现代诗参差短行 -->
      <g fill="#2345B5" fill-opacity="0.22">
        <rect x="244" y="422" width="136" height="15" rx="7.5"/>
        <rect x="242" y="456" width="184" height="15" rx="7.5"/>
        <rect x="240" y="490" width="112" height="15" rx="7.5"/>
        <rect x="238" y="544" width="156" height="15" rx="7.5"/>
        <rect x="236" y="578" width="96" height="15" rx="7.5"/>
      </g>
    </g>

    <!-- 3. 真正的广角大扇形银杏落叶（挺拔楔形底缘 + 舒展波浪扇顶 + 克制浅裂口，彻底告别爱心感） -->
    <g filter="url(#leaf-shadow)" transform="rotate(24 618 518)">
      <!-- 纤细微弯的银杏叶柄 -->
      <path d="M 618 648 C 612 604, 615 562, 618 518"
            fill="none" stroke="#C5741A" stroke-width="10" stroke-linecap="round"/>

      <!-- 左半广角扇面（挺拔外展斜边 + 舒展波浪上缘） -->
      <path d="M 618 520
               C 574 474, 510 426, 464 368
               C 476 312, 534 274, 594 278
               C 608 279, 615 294, 618 334
               L 618 520 Z"
            fill="url(#ginkgo-light)"/>

      <!-- 右半广角扇面（自然微不对称 + 浅裂口，绝无圆心形感） -->
      <path d="M 618 520
               L 618 334
               C 622 294, 632 278, 650 276
               C 710 272, 764 312, 774 368
               C 728 426, 662 474, 618 520 Z"
            fill="url(#ginkgo-dark)"/>

      <!-- 银杏扇面极淡雅的放射状细脉 -->
      <g stroke="#FFF3C8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.48" fill="none">
        <path d="M 616 510 C 574 440, 534 382, 508 326"/>
        <path d="M 617 510 C 594 434, 578 368, 574 300"/>
        <path d="M 619 510 C 642 434, 658 368, 664 300"/>
        <path d="M 620 510 C 662 440, 702 382, 730 328"/>
      </g>
    </g>
  </g>
</svg>
