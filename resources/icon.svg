<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StillPoets App Icon - 展开的诗集与秋叶（暖色画册版）</title>
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>

    <!-- 温润鼠尾草绿画册底（源自 Artbook HeroBg #CFD8C6） -->
    <linearGradient id="bg-grad" x1="0.15" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#D9E2D0"/>
      <stop offset="54%" stop-color="#C8D3BE"/>
      <stop offset="100%" stop-color="#B4C2A8"/>
    </linearGradient>

    <radialGradient id="bg-glow" cx="0.30" cy="0.20" r="0.78">
      <stop offset="0%" stop-color="#FAFDF6" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#4F5E46" stop-opacity="0.08"/>
    </radialGradient>

    <!-- 精装赤陶硬壳托底 -->
    <linearGradient id="board-grad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#B4533E"/>
      <stop offset="50%" stop-color="#9B4230"/>
      <stop offset="100%" stop-color="#BC5A44"/>
    </linearGradient>

    <!-- 纸页侧面叠层 -->
    <linearGradient id="stack-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7E1D3"/>
      <stop offset="100%" stop-color="#D8D0BF"/>
    </linearGradient>

    <!-- 左书页（受自然侧光明亮温润） -->
    <linearGradient id="left-page" x1="0" y1="0.2" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="72%" stop-color="#FDFBF5"/>
      <stop offset="92%" stop-color="#EFEADF"/>
      <stop offset="100%" stop-color="#DFD6C6"/>
    </linearGradient>

    <!-- 右书页（近书脊柔暖折影，向外渐亮） -->
    <linearGradient id="right-page" x1="0" y1="0.3" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#D5CCBB"/>
      <stop offset="11%" stop-color="#EAE3D6"/>
      <stop offset="36%" stop-color="#F8F5ED"/>
      <stop offset="100%" stop-color="#FEFDF8"/>
    </linearGradient>

    <!-- 落叶亮半面（暖阳珊瑚陶） -->
    <linearGradient id="leaf-light" x1="0.05" y1="0.75" x2="0.95" y2="0.2">
      <stop offset="0%" stop-color="#D7694A"/>
      <stop offset="50%" stop-color="#E5805A"/>
      <stop offset="100%" stop-color="#F09A6E"/>
    </linearGradient>

    <!-- 落叶暗半面（醇厚赤陶红） -->
    <linearGradient id="leaf-dark" x1="0.05" y1="0.75" x2="0.95" y2="0.2">
      <stop offset="0%" stop-color="#A1402D"/>
      <stop offset="55%" stop-color="#BC533C"/>
      <stop offset="100%" stop-color="#CE6549"/>
    </linearGradient>

    <!-- 书本柔和落地阴影 -->
    <filter id="book-shadow" x="-14%" y="-14%" width="128%" height="136%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#3A4734" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#35412F" flood-opacity="0.16"/>
    </filter>

    <!-- 落叶轻栖于纸页上的微距悬浮影 -->
    <filter id="leaf-shadow" x="-20%" y="-20%" width="145%" height="150%">
      <feDropShadow dx="6" dy="16" stdDeviation="13" flood-color="#5E3524" flood-opacity="0.23"/>
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#5E3524" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <!-- 1. 鼠尾草绿画册背景 -->
    <rect width="1024" height="1024" fill="url(#bg-grad)"/>
    <rect width="1024" height="1024" fill="url(#bg-glow)"/>

    <!-- 2. 展开的精装诗集（整体垂直居中微调 -26px，上下留白黄金平衡） -->
    <g transform="translate(0 -26)">
    <g filter="url(#book-shadow)">
      <!-- 精装赤陶硬壳底托 -->
      <path d="M 152 380
               C 150 366, 160 356, 174 358
               C 298 342, 424 358, 512 396
               C 600 358, 726 342, 850 358
               C 864 356, 874 366, 872 380
               L 886 728
               C 888 746, 875 758, 858 756
               C 728 734, 608 742, 534 774
               C 520 780, 504 780, 490 774
               C 416 742, 296 734, 166 756
               C 149 758, 136 746, 138 728 Z"
            fill="url(#board-grad)"/>

      <!-- 纸页叠层厚度 -->
      <path d="M 168 358
               C 294 326, 424 340, 512 380
               C 600 340, 730 326, 856 358
               L 864 714
               C 732 690, 606 706, 512 748
               C 418 706, 292 690, 160 714 Z"
            fill="url(#stack-grad)"/>
      <path d="M 164 700 C 292 676, 418 692, 512 734 C 606 692, 732 676, 860 700"
            fill="none" stroke="#C8C0AE" stroke-width="2.5" stroke-opacity="0.72"/>

      <!-- 左页：舒展拱起的暖棉纸 -->
      <path d="M 512 368
               C 430 320, 298 308, 178 340
               L 164 684
               C 290 656, 422 670, 512 718 Z"
            fill="url(#left-page)"/>

      <!-- 右页：对称舒展的暖棉纸 -->
      <path d="M 512 368
               C 594 320, 726 308, 846 340
               L 860 684
               C 734 656, 602 670, 512 718 Z"
            fill="url(#right-page)"/>

      <!-- 书脊中缝折影线 -->
      <path d="M 512 368 L 512 718" stroke="#C4B9A4" stroke-width="2.5" stroke-opacity="0.65"/>

      <!-- 左页极淡的现代诗参差短行 -->
      <g fill="#7A756A" fill-opacity="0.25">
        <rect x="244" y="422" width="136" height="15" rx="7.5"/>
        <rect x="242" y="456" width="184" height="15" rx="7.5"/>
        <rect x="240" y="490" width="112" height="15" rx="7.5"/>
        <rect x="238" y="544" width="156" height="15" rx="7.5"/>
        <rect x="236" y="578" width="96" height="15" rx="7.5"/>
      </g>
    </g>

    <!-- 3. 轻柔平卧在书页上的宽润赤陶秋叶 -->
    <g filter="url(#leaf-shadow)">
      <path d="M 526 572 C 546 576, 566 566, 588 548"
            fill="none" stroke="#8C3827" stroke-width="10" stroke-linecap="round"/>

      <path d="M 584 550
               C 554 472, 594 388, 678 352
               C 738 326, 804 334, 864 344
               C 786 416, 694 494, 584 550 Z"
            fill="url(#leaf-light)"/>

      <path d="M 584 550
               C 694 494, 786 416, 864 344
               C 844 410, 816 476, 756 526
               C 700 572, 634 576, 584 550 Z"
            fill="url(#leaf-dark)"/>

      <path d="M 584 550 C 676 502, 764 432, 848 354"
            fill="none" stroke="#FAD9C0" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.54"/>

      <g stroke="#FAD9C0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.34" fill="none">
        <path d="M 652 508 C 638 468, 646 432, 668 402"/>
        <path d="M 652 508 C 688 518, 722 512, 752 496"/>
        <path d="M 728 456 C 722 420, 732 392, 752 370"/>
        <path d="M 728 456 C 760 460, 788 452, 810 434"/>
      </g>
    </g>
    </g>
  </g>
</svg>
